<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" role="img" aria-label="CarryGo horizontal logo">
  <title>CarryGo</title>

  <!-- Icon: nested 360x360 at (20,20), identical geometry to logo-icon.svg -->
  <svg x="20" y="20" width="360" height="360" viewBox="0 0 1024 1024">
    <defs>
      <mask id="cg-arrow-h" maskUnits="userSpaceOnUse">
        <rect width="1024" height="1024" fill="#fff"/>
        <path d="M 192 448 H 640 V 320 L 864 512 L 640 704 V 576 H 192 Z" fill="#000"/>
      </mask>
    </defs>
    <rect width="1024" height="1024" rx="229" ry="229" fill="#0F172A" mask="url(#cg-arrow-h)"/>
  </svg>

  <!-- Wordmark: 'Carry' deep navy, 'Go' accent blue -->
  <text x="440" y="252"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-size="200"
        font-weight="800"
        letter-spacing="-6"
        fill="#0F172A">Carry<tspan fill="#2563EB">Go</tspan></text>
</svg>
