# ==============================================================================
# CarryGo Enterprise Production Nginx Configuration
# High-Throughput Reverse Proxy & Microservices Routing Engine
# Designed for 10M+ Daily API Requests & Sub-millisecond Proxy Latency
# ==============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 1048576; # Support up to 1M open file descriptors
pid /var/run/nginx.pid;

events {
    worker_connections 65536;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # --------------------------------------------------------------------------
    # 1. Performance & Zero-Copy Network Settings
    # --------------------------------------------------------------------------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;
    reset_timedout_connection on;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 15s;

    # Buffer & Payload Constraints
    client_body_buffer_size 128k;
    client_max_body_size 25M; # Supports parcel photo uploads & KYC documents
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;

    # --------------------------------------------------------------------------
    # 2. Compression (Gzip)
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # --------------------------------------------------------------------------
    # 3. Cloudflare & Real Client IP Restoration
    # --------------------------------------------------------------------------
    include /etc/nginx/cloudflare.conf;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # --------------------------------------------------------------------------
    # 4. Distributed Rate Limiting & DDOS Protection Zones
    # --------------------------------------------------------------------------
    # Limit requests per second based on real client IP
    limit_req_zone $binary_remote_addr zone=api_general_zone:20m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=api_mutations_zone:20m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_strict_zone:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=kyc_strict_zone:10m rate=3r/s;

    # Limit concurrent connections per IP
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:20m;
    limit_conn conn_limit_per_ip 50;

    # Rate limiting status codes & logging
    limit_req_status 429;
    limit_conn_status 429;

    # --------------------------------------------------------------------------
    # 5. Upstream Service Definitions (Load Balancing Topologies)
    # --------------------------------------------------------------------------

    # API Gateway Core Cluster (Least Connections for optimal latency)
    upstream api_gateway_cluster {
        least_conn; # Routes traffic to the upstream with fewest active connections
        server gateway-node-1:3000 max_fails=3 fail_timeout=10s;
        server gateway-node-2:3000 max_fails=3 fail_timeout=10s;
        server gateway-node-3:3000 max_fails=3 fail_timeout=10s backup;
        keepalive 128; # Maintain hot connection pool to eliminate TCP handshake latency
    }

    # Trips Microservice Upstream (Round Robin with Keepalive)
    upstream trip_service_upstream {
        server trip-service-1:4001 max_fails=3 fail_timeout=10s;
        server trip-service-2:4001 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    # Parcels Microservice Upstream
    upstream parcel_service_upstream {
        server parcel-service-1:4002 max_fails=3 fail_timeout=10s;
        server parcel-service-2:4002 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    # Matching Engine Microservice Upstream (Least Connections for CPU-bound tasks)
    upstream matching_service_upstream {
        least_conn;
        server match-service-1:4003 max_fails=2 fail_timeout=5s;
        server match-service-2:4003 max_fails=2 fail_timeout=5s;
        keepalive 64;
    }

    # Bookings & Escrow Microservice Upstream
    upstream booking_service_upstream {
        least_conn;
        server booking-service-1:4004 max_fails=3 fail_timeout=10s;
        server booking-service-2:4004 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    # Delivery & Tracking Microservice Upstream (Supports WebSockets)
    upstream delivery_service_upstream {
        server delivery-service-1:4005 max_fails=3 fail_timeout=10s;
        server delivery-service-2:4005 max_fails=3 fail_timeout=10s;
        keepalive 128;
    }

    # KYC & Compliance Verification Microservice Upstream
    upstream kyc_service_upstream {
        server kyc-service-1:4006 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # Notification Ingestion Gateway (Offloads to async SMS/Email/Push queues)
    upstream notification_service_upstream {
        least_conn;
        server notif-service-1:4007 max_fails=3 fail_timeout=10s;
        server notif-service-2:4007 max_fails=3 fail_timeout=10s;
        keepalive 128;
    }

    # --------------------------------------------------------------------------
    # 6. Logging Formats
    # --------------------------------------------------------------------------
    log_format microservices_json escape=json
      '{"time_local":"$time_iso8601",'
      '"client_ip":"$remote_addr",'
      '"request_id":"$request_id",'
      '"correlation_id":"$http_x_correlation_id",'
      '"request_method":"$request_method",'
      '"request_uri":"$request_uri",'
      '"server_protocol":"$server_protocol",'
      '"status":$status,'
      '"body_bytes_sent":$body_bytes_sent,'
      '"request_time":$request_time,'
      '"upstream_response_time":"$upstream_response_time",'
      '"upstream_addr":"$upstream_addr",'
      '"upstream_status":"$upstream_status",'
      '"http_user_agent":"$http_user_agent"}';

    access_log /var/log/nginx/access.log microservices_json buffer=64k flush=5s;
    error_log /var/log/nginx/error.log warn;

    # --------------------------------------------------------------------------
    # 7. HTTP to HTTPS Redirection Server Block
    # --------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name api.carrygo.in carrygo.in www.carrygo.in;

        # Let's Encrypt / ACME challenge path
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --------------------------------------------------------------------------
    # 8. HTTPS Production Server Block (Reverse Proxy & API Router)
    # --------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name api.carrygo.in;

        # SSL Certificates & Security
        ssl_certificate /etc/letsencrypt/live/api.carrygo.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.carrygo.in/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;

        # Modern TLS Profile (TLS 1.2 & TLS 1.3 only)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # OCSP Stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout 5s;

        # Security Headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none';" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

        # Standard Proxy Headers Passed to Upstreams
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;

        # Upstream Buffering & Timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout 20s;
        proxy_read_timeout 20s;
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;

        # Health Probe Endpoints (Exempt from rate limiting)
        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"healthy","uptime":"ok","region":"ap-south-1"}';
        }

        # ----------------------------------------------------------------------
        # Direct Microservice Routing
        # ----------------------------------------------------------------------

        # Trips Service Direct Routing
        location /api/v1/trips {
            limit_req zone=api_general_zone burst=30 nodelay;
            proxy_pass http://trip_service_upstream;
        }

        # Parcels Service Direct Routing
        location /api/v1/parcels {
            limit_req zone=api_general_zone burst=30 nodelay;
            proxy_pass http://parcel_service_upstream;
        }

        # Matching Engine Routing (CPU optimized)
        location /api/v1/matching {
            limit_req zone=api_general_zone burst=20 nodelay;
            proxy_pass http://matching_service_upstream;
        }

        # Booking & Escrow Operations (Strict mutation rate limits)
        location /api/v1/bookings {
            limit_req zone=api_mutations_zone burst=15 nodelay;
            proxy_pass http://booking_service_upstream;
        }

        # KYC Verification Service (Strict government gateway rate limit)
        location /api/v1/kyc {
            limit_req zone=kyc_strict_zone burst=5 nodelay;
            proxy_pass http://kyc_service_upstream;
        }

        # Delivery Tracking & Live Handover (Supports WebSockets)
        location /api/v1/delivery {
            limit_req zone=api_general_zone burst=50 nodelay;

            # WebSocket Headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400s; # Long-lived connection for GPS streaming

            proxy_pass http://delivery_service_upstream;
        }

        # Notifications Ingestion Gateway
        location /api/v1/notifications {
            limit_req zone=api_mutations_zone burst=25 nodelay;
            proxy_pass http://notification_service_upstream;
        }

        # All Other API Traffic Routes to Central API Gateway
        location / {
            limit_req zone=api_general_zone burst=50 nodelay;
            proxy_pass http://api_gateway_cluster;
        }
    }
}
